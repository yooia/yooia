<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="340">
      <stop offset="0" stop-color="#6d7bff"/>
      <stop offset="0.55" stop-color="#a86bff"/>
      <stop offset="1" stop-color="#ff7ab6"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#6d7bff"/>
      <stop offset="0.55" stop-color="#a86bff"/>
      <stop offset="1" stop-color="#ff7ab6"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="340" rx="28"/></clipPath>
    <style>
      .f1 { animation: f 6s ease-in-out infinite alternate; }
      .f2 { animation: f 5s ease-in-out -2s infinite alternate; }
      .f3 { animation: f 7s ease-in-out -4s infinite alternate; }
      @keyframes f { from { transform: translateY(-8px); } to { transform: translateY(8px); } }
      .spin { animation: s 18s linear infinite; transform-origin: 930px 190px; }
      @keyframes s { to { transform: rotate(360deg); } }
      .blink { animation: b 1.1s steps(2, start) infinite; }
      @keyframes b { to { visibility: hidden; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="#07080f"/>
    <rect x="0.5" y="0.5" width="1199" height="339" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.13"/>

    <!-- text -->
    <text x="64" y="150" font-size="104" font-weight="800" letter-spacing="-5" fill="url(#tg)">yooia</text>
    <text x="68" y="206" font-size="30" font-weight="600" fill="#f5f6fb">автоматизирую всякие приколы с AI</text>
    <text x="68" y="248" font-size="22" fill="#f5f6fb" fill-opacity="0.55">а ещё делаю сайты и Telegram-ботов</text>
    <rect class="blink" x="446" y="228" width="12" height="24" rx="2" fill="#5cf2a6"/>

    <!-- simple shapes -->
    <g class="f1">
      <circle cx="820" cy="130" r="62" fill="#6d7bff"/>
    </g>
    <g class="f2">
      <g class="spin">
        <rect x="880" y="140" width="100" height="100" rx="22" fill="none" stroke="#a86bff" stroke-width="10"/>
      </g>
    </g>
    <g class="f3">
      <path d="M1050 90 L1120 210 L980 210 Z" fill="#ff7ab6" stroke="#ff7ab6" stroke-width="12" stroke-linejoin="round"/>
    </g>
    <g class="f2">
      <circle cx="760" cy="262" r="14" fill="#5cf2a6"/>
    </g>
    <g class="f1">
      <circle cx="1110" cy="276" r="8" fill="none" stroke="#f5f6fb" stroke-opacity="0.5" stroke-width="3"/>
    </g>
  </g>
</svg>
