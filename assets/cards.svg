<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,'Segoe UI',Roboto,sans-serif">
  <style>
    .t { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; fill: #f5f6fb; }
    .s { font-size: 17px; fill: #f5f6fb; fill-opacity: .6; }
    .k { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #f5f6fb; fill-opacity: .38; }
  </style>

  <!-- AI -->
  <rect x="1" y="1" width="386" height="258" rx="28" fill="#07080f" stroke="#ffffff" stroke-opacity=".13"/>
  <circle cx="62" cy="68" r="30" fill="#6d7bff"/>
  <text x="357" y="60" class="k" text-anchor="end">01</text>
  <text x="32" y="150" class="t">AI-автоматизация</text>
  <text x="32" y="186" class="s">Нейросети + код = рутина</text>
  <text x="32" y="210" class="s">делается сама. Видео, тексты,</text>
  <text x="32" y="234" class="s">картинки, любые приколы.</text>

  <!-- sites -->
  <rect x="407" y="1" width="386" height="258" rx="28" fill="#07080f" stroke="#ffffff" stroke-opacity=".13"/>
  <rect x="436" y="42" width="54" height="54" rx="14" fill="none" stroke="#a86bff" stroke-width="8"/>
  <text x="763" y="60" class="k" text-anchor="end">02</text>
  <text x="438" y="150" class="t">Сайты</text>
  <text x="438" y="186" class="s">Лендинги и портфолио,</text>
  <text x="438" y="210" class="s">которые не стыдно показать.</text>
  <text x="438" y="234" class="s">С анимациями и 3D.</text>

  <!-- bots -->
  <rect x="813" y="1" width="386" height="258" rx="28" fill="#07080f" stroke="#ffffff" stroke-opacity=".13"/>
  <path d="M874 40 L904 94 L844 94 Z" fill="#ff7ab6" stroke="#ff7ab6" stroke-width="8" stroke-linejoin="round"/>
  <text x="1169" y="60" class="k" text-anchor="end">03</text>
  <text x="844" y="150" class="t">Telegram-боты</text>
  <text x="844" y="186" class="s">Заявки, оплата, рассылки,</text>
  <text x="844" y="210" class="s">мини-аппы. Бот работает,</text>
  <text x="844" y="234" class="s">пока ты спишь.</text>
</svg>
